[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statelet"
version = "0.1.3"
description = "Statelet server binaries — agent memory with KV, vector search, and temporal causal graphs in one database"
readme = "README.md"
# Must track statelet-sdk's floor: the sdk's generated grpc stubs need
# grpcio>=1.81, which dropped py3.9 (same trap statelet-lite hit 2026-08-21:
# a py3.9 pip "solved" the environment by downgrading the sdk past its fix).
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["statelet", "agent", "memory", "vector", "graph", "database", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

# The client library is not duplicated here. Two distributions cannot both own
# the `statelet` import package: pip would let them overwrite each other's
# files and uninstalling either would break the other. So `statelet` ships the
# servers under `statelet_server` and pulls the client in as a dependency,
# which keeps `pip install statelet` a single step while leaving exactly one
# authoritative copy of the client code, in stateletlab/statelet-sdk.
dependencies = [
    # 0.1.5 is the first sdk release whose metadata declares the real
    # python/grpcio floor; anything older lets pip "solve" an incompatible
    # environment by downgrading the sdk instead of refusing the install.
    "statelet-sdk>=0.1.5",
    # The gateway loads libonnxruntime dynamically for semantic search; the
    # wrapper points ORT_DYLIB_PATH at the copy inside this wheel so users
    # never install ONNX Runtime by hand.
    "onnxruntime>=1.20",
]

[project.scripts]
statelet-gateway = "statelet_server._cli:gateway"
statelet-metadata = "statelet_server._cli:metadata"
statelet-datanode = "statelet_server._cli:datanode"
statelet-cluster = "statelet_server._cluster:main"

[project.urls]
Homepage = "https://statelet.com"
Repository = "https://github.com/stateletlab/statelet"

[tool.setuptools]
packages = ["statelet_server", "statelet_server.bin"]

[tool.setuptools.package-data]
"statelet_server.bin" = ["*"]
# The built admin UI. Vite emits index.html plus a hashed assets/ tree, so this
# has to be recursive rather than a flat glob.
"statelet_server" = ["ui/**/*"]
