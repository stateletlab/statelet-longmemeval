[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statelet-lite"
version = "0.1.0"
description = "Statelet Lite — the whole database in one single-node binary: KV, vector search, and temporal causal graphs"
readme = "README.md"
# Must track statelet-sdk's floor: the sdk's generated grpc stubs need
# grpcio>=1.81, which dropped py3.9. With ">=3.9" here, a py3.9 pip resolved
# lite 0.1.5 + sdk 0.1.4 (auto-downgrading the sdk past its own fix) and
# `import statelet` still failed on the grpc version check (2026-08-21).
requires-python = ">=3.10"
license = "FSL-1.1-ALv2"
keywords = ["statelet", "agent", "memory", "vector", "graph", "database", "llm", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

# Same shape as the `statelet` (EE) wheel: the servers live under their own
# import package and the client comes in as a dependency, so `pip install
# statelet-lite` is one step and `import statelet` works in the same
# environment without two distributions fighting over one import name.
dependencies = [
    # 0.1.5 is the first sdk release whose metadata declares the real
    # python/grpcio floor; anything older lets pip "solve" an incompatible
    # environment by downgrading the sdk instead of refusing the install.
    "statelet-sdk>=0.1.5",
]

[project.scripts]
statelet-lite = "statelet_lite._cli:main"

[project.urls]
Homepage = "https://statelet.com"
Repository = "https://github.com/stateletlab/statelet"

[tool.setuptools]
packages = ["statelet_lite", "statelet_lite.bin"]

[tool.setuptools.package-data]
"statelet_lite.bin" = ["*"]
# The built admin UI. Vite emits index.html plus a hashed assets/ tree, so this
# has to be recursive rather than a flat glob.
"statelet_lite" = ["ui/**/*"]
