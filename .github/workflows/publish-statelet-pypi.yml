# Builds the `statelet` PyPI distribution from the (private) engine repository.
#
# The engine lives in stateletlab/statelet, which is private; this repository is
# public and owns the PyPI Trusted Publishing identity for the `statelet`
# project. So the source is checked out here with a PAT, the Rust server
# binaries are cross-compiled per platform, stuffed into the Python SDK, and the
# resulting platform wheels are published under one release.
#
# Required repository configuration:
#   secrets.STATELET_REPO_TOKEN  fine-grained PAT with Contents:read on
#                                stateletlab/statelet
#   environment `pypi`           bound to a PyPI Trusted Publisher for project
#                                `statelet`, workflow `publish-statelet-pypi.yml`,
#                                owner `stateletlab`, repo `statelet-longmemeval`
#
# Note: the engine source is private. Keep this workflow on manual/tag triggers
# only — never `pull_request`, which would expose the token and the build log to
# fork contributors.

name: Publish statelet to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch, tag or SHA) of stateletlab/statelet to build"
        required: false
        default: main
      version:
        description: "Override the version in sdk/python/pyproject.toml (blank = use as-is)"
        required: false
        default: ""
      dry_run:
        description: "Build and smoke-test the wheels but do not publish"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "statelet-v*"

permissions:
  contents: read

concurrency:
  group: publish-statelet-pypi
  cancel-in-progress: false

jobs:
  build-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (native)
            target: aarch64-apple-darwin
            platform_tag: macosx_11_0_arm64
            native: "yes"
          - os: macos-14          # Intel Mac (cross-compile on arm64)
            target: x86_64-apple-darwin
            platform_tag: macosx_10_12_x86_64
            native: "no"
          # The Linux wheels build inside the official manylinux images so the
          # glibc floor in the tag is a property of the toolchain rather than a
          # string we assert. Building on ubuntu-latest and relabelling would
          # produce a binary needing glibc 2.39 in a wheel pip hands to CentOS 7.
          - os: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
            platform_tag: manylinux_2_28_x86_64
            glibc_max: "2.28"
            native: "yes"
          - os: ubuntu-24.04-arm  # native ARM runner, so no cross toolchain
            container: quay.io/pypa/manylinux_2_28_aarch64
            target: aarch64-unknown-linux-gnu
            platform_tag: manylinux_2_28_aarch64
            glibc_max: "2.28"
            native: "yes"

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    defaults:
      run:
        working-directory: statelet

    steps:
      # `statelet-v0.1.1` here builds engine tag `v0.1.1`. Refs go through env
      # rather than `${{ }}` interpolation so a ref name can never be spliced
      # into this shell.
      - name: Resolve engine ref
        id: ref
        working-directory: .
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            case "$GITHUB_REF_TYPE" in
              tag) REF="${GITHUB_REF_NAME#statelet-}" ;;
              *)   REF="main" ;;
            esac
          fi
          printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"
          printf 'Building stateletlab/statelet@%s\n' "$REF"

      # The manylinux images are AlmaLinux 8 and carry gcc/cmake/perl but not
      # clang, which librocksdb-sys needs for bindgen, nor the perl modules
      # openssl-src drives its build with.
      - name: Install container build deps
        if: matrix.container != ''
        working-directory: .
        run: |
          set -euo pipefail
          dnf -y install clang perl-IPC-Cmd perl-Data-Dumper perl-FindBin
          git config --global --add safe.directory '*'

      - name: Checkout stateletlab/statelet
        uses: actions/checkout@v4
        with:
          repository: stateletlab/statelet
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.STATELET_REPO_TOKEN }}
          path: statelet
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: statelet
          key: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # setup-python has nothing to offer inside a manylinux image, which ships
      # its own interpreters; on macOS it is the only way to pin one. Both
      # branches leave the chosen interpreter in $PYBIN.
      - name: Set up Python (macOS)
        if: matrix.container == ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select interpreter
        working-directory: .
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.container }}" ]; then
            echo "PYBIN=/opt/python/cp312-cp312/bin/python" >> "$GITHUB_ENV"
          else
            echo "PYBIN=$(command -v python)" >> "$GITHUB_ENV"
          fi

      - name: Apply version override
        if: inputs.version != ''
        run: |
          "$PYBIN" - <<'PY'
          import re, pathlib, os
          p = pathlib.Path("sdk/python/pyproject.toml")
          s = p.read_text()
          s, n = re.subn(r'(?m)^version = ".*"$',
                         'version = "%s"' % os.environ["NEW_VERSION"], s, count=1)
          assert n == 1, "no version line found in sdk/python/pyproject.toml"
          p.write_text(s)
          PY
        env:
          NEW_VERSION: ${{ inputs.version }}

      # --locked: build exactly the graph in the engine's committed Cargo.lock.
      # Without it a floating dependency can pick up a newer release than the
      # one that was tested and fail here (ort rc.12 -> rc.13 did exactly that),
      # or worse, publish a wheel built from an untested graph.
      - name: Build Rust binaries
        run: cargo build --locked --release --features data-node,agent-state --target ${{ matrix.target }}

      - name: Stage binaries into the SDK
        run: |
          set -euo pipefail
          TARGET_DIR="target/${{ matrix.target }}/release"
          BIN_DIR="sdk/python/statelet/bin"
          mkdir -p "$BIN_DIR"
          cp "$TARGET_DIR/metadata_service" "$BIN_DIR/statelet-metadata"
          cp "$TARGET_DIR/raft_engine"      "$BIN_DIR/statelet-datanode"
          cp "$TARGET_DIR/gateway"          "$BIN_DIR/statelet-gateway"
          chmod +x "$BIN_DIR"/statelet-*

      # The platform tag is a promise to pip, and pip enforces nothing at
      # install time — an over-claimed glibc floor surfaces as a runtime
      # "GLIBC_x.y not found" on the user's machine. Break the build instead.
      - name: Verify the glibc floor matches the wheel tag
        if: matrix.glibc_max != ''
        run: |
          set -euo pipefail
          need="$(for b in sdk/python/statelet/bin/statelet-*; do
                    objdump -T "$b" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' || true
                  done | sort -uV | tail -1)"
          need="${need#GLIBC_}"
          echo "binaries need at most glibc ${need:-none}; tag promises ${{ matrix.glibc_max }}"
          if [ -n "$need" ] && \
             [ "$(printf '%s\n%s\n' "$need" "${{ matrix.glibc_max }}" | sort -V | tail -1)" \
               != "${{ matrix.glibc_max }}" ]; then
            echo "::error::binaries require glibc $need but the wheel is tagged ${{ matrix.platform_tag }}"
            exit 1
          fi

      - name: Build wheel
        run: |
          set -euo pipefail
          "$PYBIN" -m pip install --upgrade build wheel setuptools

          cd sdk/python
          "$PYBIN" -m build --wheel --no-isolation

          # setuptools produces py3-none-any because the payload is data files,
          # not an extension module; retag so pip only offers each wheel to the
          # platform whose binaries it actually carries.
          ANY_WHEEL="$(ls dist/statelet-*-py3-none-any.whl | head -1)"
          TMPDIR="$(mktemp -d)"
          "$PYBIN" -m wheel unpack -d "$TMPDIR" "$ANY_WHEEL"
          UNPACKED="$(ls -d "$TMPDIR"/statelet-*)"
          sed -i'' -e 's/^Tag: py3-none-any$/Tag: py3-none-${{ matrix.platform_tag }}/' \
              "$UNPACKED"/statelet-*.dist-info/WHEEL
          "$PYBIN" -m wheel pack -d dist "$UNPACKED"
          rm -f "$ANY_WHEEL"
          rm -rf "$TMPDIR"

          ls -lh dist/

      - name: Smoke-test the wheel
        if: matrix.native == 'yes'
        run: |
          set -euo pipefail
          "$PYBIN" -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install sdk/python/dist/*.whl
          /tmp/smoke/bin/python -c "import statelet; print('statelet', statelet.__file__)"
          /tmp/smoke/bin/python -c "from statelet import statelet_pb2, statelet_pb2_grpc"
          # The `statelet-gateway`/`-metadata`/`-datanode` console scripts are
          # thin shims that exec these files; if the retag/copy dance dropped
          # them the wheel is useless, so fail the build rather than ship it.
          /tmp/smoke/bin/python - <<'PY'
          import os, sys, statelet
          bindir = os.path.join(os.path.dirname(statelet.__file__), "bin")
          present = sorted(f for f in os.listdir(bindir) if f.startswith("statelet-"))
          print("bundled binaries:", present)
          missing = {"statelet-gateway", "statelet-metadata", "statelet-datanode"} - set(present)
          if missing:
              sys.exit("missing from wheel: %s" % sorted(missing))
          for f in present:
              if not os.access(os.path.join(bindir, f), os.X_OK):
                  sys.exit("not executable in wheel: %s" % f)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: statelet/sdk/python/dist/*.whl
          if-no-files-found: error

  publish:
    needs: build-wheel
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
