# Builds the `statelet` PyPI distribution from the (private) engine repository.
#
# The engine lives in stateletlab/statelet, which is private; this repository is
# public and owns the PyPI Trusted Publishing identity for the `statelet`
# project. So the source is checked out here with a PAT, the Rust server
# binaries are built per platform, stuffed into the Python SDK, and the
# resulting platform wheels are published under one release.
#
# Required repository configuration:
#   secrets.STATELET_REPO_TOKEN  fine-grained PAT with Contents:read on
#                                stateletlab/statelet
#   environment `pypi`           bound to a PyPI Trusted Publisher for project
#                                `statelet`, workflow `publish-statelet-pypi.yml`,
#                                owner `stateletlab`, repo `statelet-longmemeval`
#
# Note: the engine source is private. Keep this workflow on manual/tag triggers
# only — never `pull_request`, which would expose the token and the build log to
# fork contributors.

name: Publish statelet to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (branch, tag or SHA) of stateletlab/statelet to build"
        required: false
        default: main
      version:
        description: "Override the wheel version (blank = use packaging/pypi/pyproject.toml as-is)"
        required: false
        default: ""
      dry_run:
        description: "Build and smoke-test the wheels but do not publish"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "statelet-v*"

permissions:
  contents: read

concurrency:
  group: publish-statelet-pypi
  cancel-in-progress: false

jobs:
  build-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon (native)
            target: aarch64-apple-darwin
            platform_tag: macosx_11_0_arm64
            native: "yes"
          - os: macos-14          # Intel Mac (cross-compile on arm64)
            target: x86_64-apple-darwin
            platform_tag: macosx_10_12_x86_64
            native: "no"
          # The Linux binaries compile inside the official manylinux images so
          # the glibc floor in the tag is a property of the toolchain rather
          # than a string we assert. Building on ubuntu-latest and relabelling
          # would emit a binary needing glibc 2.39 under a tag promising 2.17,
          # which pip installs happily and which then cannot start.
          #
          # manylinux2014 (glibc 2.17) rather than a newer floor: it reaches
          # back to CentOS 7 and RHEL 7, and a lower floor is never worse for
          # the installing user — pip simply has more machines it can serve.
          #
          # The image is a `docker run` inside the job, not the job's
          # `container:`. CentOS 7 predates glibc 2.28, which the runner's own
          # node20 needs, so actions/checkout and friends have to stay on the
          # host. Only cargo goes inside.
          - os: ubuntu-latest
            build_image: quay.io/pypa/manylinux2014_x86_64
            target: x86_64-unknown-linux-gnu
            platform_tag: manylinux2014_x86_64
            glibc_max: "2.17"
            native: "yes"
          - os: ubuntu-24.04-arm  # native ARM runner, so no cross toolchain
            build_image: quay.io/pypa/manylinux2014_aarch64
            target: aarch64-unknown-linux-gnu
            platform_tag: manylinux2014_aarch64
            glibc_max: "2.17"
            native: "yes"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_tag: win_amd64
            native: "yes"

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash everywhere, including Windows (Git Bash), so one script serves
        # every row instead of a PowerShell fork of each step.
        shell: bash
        working-directory: statelet

    steps:
      # `statelet-v0.1.1` here builds engine tag `v0.1.1`. Refs go through env
      # rather than `${{ }}` interpolation so a ref name can never be spliced
      # into this shell.
      - name: Resolve engine ref
        id: ref
        working-directory: .
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            case "$GITHUB_REF_TYPE" in
              tag) REF="${GITHUB_REF_NAME#statelet-}" ;;
              *)   REF="main" ;;
            esac
          fi
          printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"
          printf 'Building stateletlab/statelet@%s\n' "$REF"

      # windows-latest ships LLVM and Strawberry Perl, but neither is wired up:
      # librocksdb-sys' bindgen needs LIBCLANG_PATH, and openssl-src otherwise
      # finds Git Bash's perl, which cannot drive the MSVC build.
      - name: Configure Windows build toolchain
        if: runner.os == 'Windows'
        working-directory: .
        run: |
          set -euo pipefail
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            printf 'LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin\n' >> "$GITHUB_ENV"
          else
            echo "::error::LLVM not found; librocksdb-sys bindgen will fail"
            exit 1
          fi
          if [ -x "/c/Strawberry/perl/bin/perl.exe" ]; then
            printf 'OPENSSL_SRC_PERL=C:\\Strawberry\\perl\\bin\\perl.exe\n' >> "$GITHUB_ENV"
          else
            echo "::error::Strawberry Perl not found; the vendored OpenSSL build will fail"
            exit 1
          fi

      # This repository carries the wheel's packaging skeleton and the
      # container build script; the engine supplies only compiled binaries.
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: lme
          persist-credentials: false

      - name: Checkout stateletlab/statelet
        uses: actions/checkout@v4
        with:
          repository: stateletlab/statelet
          ref: ${{ steps.ref.outputs.ref }}
          token: ${{ secrets.STATELET_REPO_TOKEN }}
          path: statelet
          persist-credentials: false

      # Rust is installed on the host only for the rows that build there; the
      # manylinux rows install it inside the container, where the build runs.
      # No protoc step anywhere: the engine's build.rs sets PROTOC from
      # protoc-bin-vendored itself.
      - name: Install Rust
        if: matrix.build_image == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        if: matrix.build_image == ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: statelet
          key: ${{ matrix.target }}

      # The wheel is assembled on the host on every row — it is a zip of files
      # whose contents do not depend on which interpreter packed them, and the
      # platform tag is set by hand below.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --locked: build exactly the graph in the engine's committed Cargo.lock.
      # Without it a floating dependency can pick up a newer release than the
      # one that was tested and fail here (ort rc.12 -> rc.13 did exactly that),
      # or worse, publish a wheel built from an untested graph.
      - name: Build Rust binaries
        if: matrix.build_image == ''
        run: cargo build --locked --release --features data-node,agent-state --target ${{ matrix.target }}

      - name: Build Rust binaries (manylinux container)
        if: matrix.build_image != ''
        working-directory: .
        env:
          BUILD_IMAGE: ${{ matrix.build_image }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" -w /work/statelet \
            -e CARGO_HOME=/work/.cargo-home \
            -e CARGO_TERM_COLOR=always \
            -e TARGET="$TARGET" \
            "$BUILD_IMAGE" \
            bash /work/lme/.github/scripts/manylinux-build.sh

      # The wheel source is this repository's packaging skeleton, not anything
      # from the engine checkout — the engine contributes compiled binaries and
      # nothing else, so moving its SDKs out to stateletlab/statelet-sdk cannot
      # break this build.
      - name: Assemble the wheel source tree
        working-directory: .
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in Windows) EXE=".exe" ;; *) EXE="" ;; esac
          rm -rf wheel-src
          cp -R lme/packaging/pypi wheel-src

          TARGET_DIR="statelet/target/${{ matrix.target }}/release"
          BIN_DIR="wheel-src/statelet_server/bin"
          cp "$TARGET_DIR/metadata_service$EXE" "$BIN_DIR/statelet-metadata$EXE"
          cp "$TARGET_DIR/raft_engine$EXE"      "$BIN_DIR/statelet-datanode$EXE"
          cp "$TARGET_DIR/gateway$EXE"          "$BIN_DIR/statelet-gateway$EXE"
          chmod +x "$BIN_DIR"/statelet-*
          ls -lh "$BIN_DIR"

      - name: Apply version override
        if: inputs.version != ''
        working-directory: .
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          p = pathlib.Path("wheel-src/pyproject.toml")
          s = p.read_text()
          s, n = re.subn(r'(?m)^version = ".*"$',
                         'version = "%s"' % os.environ["NEW_VERSION"], s, count=1)
          assert n == 1, "no version line found in packaging/pypi/pyproject.toml"
          p.write_text(s)
          PY

      # The platform tag is a promise to pip, and pip enforces nothing at
      # install time — an over-claimed glibc floor surfaces as a runtime
      # "GLIBC_x.y not found" on the user's machine. Break the build instead.
      - name: Verify the glibc floor matches the wheel tag
        if: matrix.glibc_max != ''
        working-directory: .
        run: |
          set -euo pipefail
          need="$(for b in wheel-src/statelet_server/bin/statelet-*; do
                    objdump -T "$b" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' || true
                  done | sort -uV | tail -1)"
          need="${need#GLIBC_}"
          echo "binaries need at most glibc ${need:-none}; tag promises ${{ matrix.glibc_max }}"
          if [ -n "$need" ] && \
             [ "$(printf '%s\n%s\n' "$need" "${{ matrix.glibc_max }}" | sort -V | tail -1)" \
               != "${{ matrix.glibc_max }}" ]; then
            echo "::error::binaries require glibc $need but the wheel is tagged ${{ matrix.platform_tag }}"
            exit 1
          fi

      - name: Build wheel
        working-directory: .
        run: |
          set -euo pipefail
          python -m pip install --upgrade build wheel setuptools

          cd wheel-src
          python -m build --wheel --no-isolation

          # setuptools produces py3-none-any because the payload is data files,
          # not an extension module; retag so pip only offers each wheel to the
          # platform whose binaries it actually carries.
          ANY_WHEEL="$(ls dist/statelet-*-py3-none-any.whl | head -1)"
          TMPDIR="$(mktemp -d)"
          python -m wheel unpack -d "$TMPDIR" "$ANY_WHEEL"
          UNPACKED="$(ls -d "$TMPDIR"/statelet-*)"
          sed -i'' -e 's/^Tag: py3-none-any$/Tag: py3-none-${{ matrix.platform_tag }}/' \
              "$UNPACKED"/statelet-*.dist-info/WHEEL
          python -m wheel pack -d dist "$UNPACKED"
          rm -f "$ANY_WHEEL"
          rm -rf "$TMPDIR"

          ls -lh dist/

      - name: Smoke-test the wheel
        if: matrix.native == 'yes'
        working-directory: .
        run: |
          set -euo pipefail
          # Windows venvs put the interpreter in Scripts/, not bin/.
          case "$RUNNER_OS" in Windows) VBIN="Scripts" ;; *) VBIN="bin" ;; esac
          python -m venv smoke-venv
          V="smoke-venv/$VBIN"
          "$V/python" -m pip install --upgrade pip
          # --no-deps: this checks the wheel we just built, not PyPI's copy of
          # statelet-client, which the dependency would otherwise drag in (and
          # which does not exist yet on a first release).
          "$V/python" -m pip install --no-deps wheel-src/dist/*.whl
          "$V/python" -c "import statelet_server; print(statelet_server.__file__)"
          # The console scripts are thin shims that exec these files; if the
          # retag/copy dance dropped them the wheel is useless, so fail the
          # build rather than ship it.
          "$V/python" - <<'PY'
          import os, sys, statelet_server
          bindir = os.path.join(os.path.dirname(statelet_server.__file__), "bin")
          found = [f for f in os.listdir(bindir) if f.startswith("statelet-")]
          # Windows wheels carry the .exe suffix; compare on the bare stem.
          present = sorted(os.path.splitext(f)[0] if f.endswith(".exe") else f for f in found)
          print("bundled binaries:", sorted(found))
          missing = {"statelet-gateway", "statelet-metadata", "statelet-datanode"} - set(present)
          if missing:
              sys.exit("missing from wheel: %s" % sorted(missing))
          for name in sorted(present):
              resolved = statelet_server.binary_path(name)
              if not os.path.isfile(resolved):
                  sys.exit("binary_path() does not resolve: %s -> %s" % (name, resolved))
          if os.name != "nt":
              for f in found:
                  if not os.access(os.path.join(bindir, f), os.X_OK):
                      sys.exit("not executable in wheel: %s" % f)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: wheel-src/dist/*.whl
          if-no-files-found: error

  publish:
    needs: build-wheel
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true
