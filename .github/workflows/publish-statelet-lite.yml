# Builds `statelet-lite` — the whole database in ONE single-node process —
# once per platform and ships every distribution channel from that build,
# mirroring the EE pipeline (publish-statelet-pypi.yml):
#
#   wheel           every platform, published to PyPI as `statelet-lite`
#   binary+tarball  every platform, attached to the GitHub Release
#   .deb            amd64, arm64      apt   (same `packages` branch as EE)
#   .rpm            x86_64, aarch64   yum/dnf
#   .msi            x86_64            winget (stateletlab.StateletLite)
#   formula         Homebrew tap      (Formula/statelet-lite.rb)
#
# `statelet-lite` fuses the three server roles (metadata plane, data node,
# gateway) into one binary, hard-locked to a single node; this is the
# FSL-licensed distribution form, while the separate cluster binaries the EE
# workflow ships are the enterprise-licensed one. Because both products bind
# the same default ports and install the admin UI at the same
# share/statelet/ui path, the lite deb/rpm/brew packages declare a conflict
# with the EE `statelet` package rather than pretending to coexist with it.
#
# Per platform the release carries two assets:
#
#   statelet-lite-<version>-<platform>[.exe]     the bare binary — curl it,
#                                                chmod it, run it
#   statelet-lite-<version>-<platform>.tar.gz    the binary plus the admin UI
#   (.zip on Windows)
#
# Both, because the admin UI is not embedded: the fused process serves it from
# a `ui/` directory next to its own executable, so the bare binary runs fine
# but answers 404 on the management port. The archive is the form that
# includes it, and the one brew installs from.
#
# Releases are tagged `lite-v<version>` so they never collide with the EE
# releases (`v<version>`) on this repository. Same repository for the same
# reason as the EE channels: the engine repo is private, and private release
# assets are not downloadable.
#
# Required configuration:
#   secrets.STATELET_REPO_TOKEN  fine-grained PAT, Contents:read on
#                                stateletlab/statelet (shared with the EE
#                                workflow)
#   environment `pypi`           the PyPI project `statelet-lite` needs its
#                                own Trusted Publisher entry: owner
#                                `stateletlab`, repo `statelet-longmemeval`,
#                                workflow `publish-statelet-lite.yml`,
#                                environment `pypi` — the EE publisher is
#                                bound to the other workflow filename and does
#                                not cover this one.
# Optional — the matching job is skipped when absent, rather than failing:
#   secrets.TAP_GITHUB_TOKEN     write access to stateletlab/homebrew-statelet
#   secrets.WINGET_GITHUB_TOKEN  a token that can open PRs against winget-pkgs
#
# Note: the engine source is private. Manual/tag triggers only — never
# `pull_request`, which would expose the token to fork contributors.

name: Publish statelet-lite (single binary PyPI/apt/yum/brew/winget)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, no leading v (e.g. 0.1.1)"
        required: true
      ref:
        description: "Ref of stateletlab/statelet to build"
        required: false
        default: main
      dry_run:
        description: "Build, package and smoke-test, but publish nothing"
        type: boolean
        required: false
        default: false
      skip_pypi:
        description: "Skip the PyPI upload (packages only)"
        type: boolean
        required: false
        default: false
      skip_packages:
        description: "Skip the release and every package channel (PyPI only)"
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "statelet-lite-v*"

permissions:
  contents: read

concurrency:
  group: publish-statelet-lite
  cancel-in-progress: false

jobs:
  # Tag `statelet-lite-v0.1.1` builds engine ref `v0.1.1` as version 0.1.1 —
  # the engine is tagged once and both this and the EE workflow build from it.
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#statelet-lite-v}"
            REF="${GITHUB_REF_NAME#statelet-lite-}"
          else
            VERSION="$INPUT_VERSION"
            REF="${INPUT_REF:-main}"
          fi
          test -n "$VERSION" || { echo "::error::no version to build"; exit 1; }
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n'     "$REF"     >> "$GITHUB_OUTPUT"
          printf 'Building stateletlab/statelet@%s as statelet-lite %s\n' "$REF" "$VERSION"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same five rows and the same toolchain discipline as the EE
          # workflow — see publish-statelet-pypi.yml for why the Linux rows
          # build inside manylinux containers via `docker run` and what the
          # glibc floor check protects.
          - os: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            platform_tag: macosx_11_0_arm64
            native: "yes"
          - os: macos-14
            target: x86_64-apple-darwin
            platform: darwin-amd64
            platform_tag: macosx_10_12_x86_64
            native: "no"
          - os: ubuntu-latest
            build_image: quay.io/pypa/manylinux2014_x86_64
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
            platform_tag: manylinux2014_x86_64
            glibc_max: "2.17"
            native: "yes"
          - os: ubuntu-24.04-arm
            build_image: quay.io/pypa/manylinux2014_aarch64
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            platform_tag: manylinux2014_aarch64
            glibc_max: "2.17"
            native: "yes"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
            platform_tag: win_amd64
            native: "yes"

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: statelet

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: lme
          persist-credentials: false

      - name: Checkout stateletlab/statelet
        uses: actions/checkout@v4
        with:
          repository: stateletlab/statelet
          ref: ${{ needs.meta.outputs.ref }}
          token: ${{ secrets.STATELET_REPO_TOKEN }}
          path: statelet
          persist-credentials: false

      # See publish-statelet-pypi.yml for why these are wired by hand.
      - name: Configure Windows build toolchain
        if: runner.os == 'Windows'
        working-directory: .
        run: |
          set -euo pipefail
          test -d "/c/Program Files/LLVM/bin" \
            || { echo "::error::LLVM not found"; exit 1; }
          test -x "/c/Strawberry/perl/bin/perl.exe" \
            || { echo "::error::Strawberry Perl not found"; exit 1; }
          printf 'LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin\n' >> "$GITHUB_ENV"
          printf 'OPENSSL_SRC_PERL=C:\\Strawberry\\perl\\bin\\perl.exe\n' >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # For the wheel, which is assembled on the host on every row — it is a
      # zip of data files, and the platform tag is set by hand below.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the admin UI
        working-directory: statelet/ui
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          test -f dist/index.html || { echo "::error::UI build produced no index.html"; exit 1; }
          du -sh dist

      - name: Install Rust
        if: matrix.build_image == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        if: matrix.build_image == ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: statelet
          key: lite-${{ matrix.target }}

      # `--bin statelet-lite` builds only the fused binary, not the ee/ crate.
      # data-node is its required feature; agent-state is the FSL-licensed
      # agent-memory surface (the enterprise capabilities are enabled only via
      # the ee/ crate, which this build never touches).
      # STATELET_LITE_VERSION bakes the RELEASE version into `--version`:
      # the crate version in Cargo.toml does not track the distribution
      # version, so without it every wheel/brew/deb binary reported "0.1.0"
      # (API audit 2026-08-21).
      - name: Build statelet-lite
        if: matrix.build_image == ''
        env:
          STATELET_LITE_VERSION: ${{ needs.meta.outputs.version }}
        run: cargo build --locked --release --features data-node,agent-state --bin statelet-lite --target ${{ matrix.target }}

      - name: Build statelet-lite (manylinux container)
        if: matrix.build_image != ''
        working-directory: .
        env:
          BUILD_IMAGE: ${{ matrix.build_image }}
          TARGET: ${{ matrix.target }}
          STATELET_LITE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/work" -w /work/statelet \
            -e CARGO_HOME=/work/.cargo-home \
            -e CARGO_TERM_COLOR=always \
            -e TARGET="$TARGET" \
            -e STATELET_LITE_VERSION="$STATELET_LITE_VERSION" \
            -e CARGO_EXTRA_ARGS="--bin statelet-lite" \
            "$BUILD_IMAGE" \
            bash /work/lme/.github/scripts/manylinux-build.sh

      - name: Stage the payload
        working-directory: .
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in Windows) EXE=".exe" ;; *) EXE="" ;; esac
          SRC="statelet/target/${{ matrix.target }}/release"
          rm -rf stage && mkdir -p stage
          cp "$SRC/statelet-lite$EXE" "stage/statelet-lite$EXE"
          chmod +x "stage/statelet-lite$EXE"
          # The fused process serves the admin UI from `ui/` next to its own
          # executable, exactly like the cluster gateway.
          cp -R statelet/ui/dist stage/ui
          ls -lh stage

      # Same contract as the EE packages: the floor we imply by building in
      # manylinux2014 has to be one the binary actually meets.
      - name: Verify the glibc floor
        if: matrix.glibc_max != ''
        working-directory: .
        run: |
          set -euo pipefail
          need="$(objdump -T stage/statelet-lite \
                    | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1 || true)"
          need="${need#GLIBC_}"
          echo "binary needs at most glibc ${need:-none}; floor is ${{ matrix.glibc_max }}"
          if [ -n "$need" ] && \
             [ "$(printf '%s\n%s\n' "$need" "${{ matrix.glibc_max }}" | sort -V | tail -1)" \
               != "${{ matrix.glibc_max }}" ]; then
            echo "::error::binary requires glibc $need, above the floor ${{ matrix.glibc_max }}"
            exit 1
          fi

      - name: Assemble release assets
        working-directory: .
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          NAME="statelet-lite-${VERSION}-${{ matrix.platform }}"
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp stage/statelet-lite.exe "out/${NAME}.exe"
            (cd stage && 7z a -tzip "../out/${NAME}.zip" ./*) >/dev/null
          else
            cp stage/statelet-lite "out/${NAME}"
            tar -czf "out/${NAME}.tar.gz" -C stage .
          fi
          ls -lh out

      # `lite-*` feeds the release; `stage-lite-*` deliberately falls outside
      # that download pattern — it is the unpacked payload the deb/rpm/msi
      # jobs package, not an asset to publish.
      - uses: actions/upload-artifact@v4
        with:
          name: lite-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: stage-lite-${{ matrix.platform }}
          path: stage/
          if-no-files-found: error

      # ── PyPI wheel ─────────────────────────────────────────────────────────

      # The wheel source is this repository's packaging skeleton
      # (packaging/pypi-lite), not anything from the engine checkout — the
      # engine contributes the compiled binary and nothing else.
      - name: Assemble the wheel source tree
        working-directory: .
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in Windows) EXE=".exe" ;; *) EXE="" ;; esac
          rm -rf wheel-src
          cp -R lme/packaging/pypi-lite wheel-src

          BIN_DIR="wheel-src/statelet_lite/bin"
          cp "stage/statelet-lite$EXE" "$BIN_DIR/statelet-lite$EXE"
          chmod +x "$BIN_DIR"/statelet-lite*
          ls -lh "$BIN_DIR"

          UI_DIR="wheel-src/statelet_lite/ui"
          rm -rf "$UI_DIR" && mkdir -p "$UI_DIR"
          cp -R stage/ui/. "$UI_DIR"/
          test -f "$UI_DIR/index.html"
          echo "admin UI staged:"; find "$UI_DIR" -type f | head

      # The wheel always carries the release version, so PyPI, the release tag
      # and every package agree — packaging/pypi-lite/pyproject.toml's own
      # version line is only a fallback for local builds.
      - name: Set the wheel version
        working-directory: .
        env:
          NEW_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          p = pathlib.Path("wheel-src/pyproject.toml")
          s = p.read_text()
          s, n = re.subn(r'(?m)^version = ".*"$',
                         'version = "%s"' % os.environ["NEW_VERSION"], s, count=1)
          assert n == 1, "no version line found in packaging/pypi-lite/pyproject.toml"
          p.write_text(s)
          PY

      - name: Build wheel
        working-directory: .
        run: |
          set -euo pipefail
          python -m pip install --upgrade build wheel setuptools

          cd wheel-src
          python -m build --wheel --no-isolation

          # setuptools produces py3-none-any because the payload is data files,
          # not an extension module; retag so pip only offers each wheel to the
          # platform whose binary it actually carries.
          ANY_WHEEL="$(ls dist/statelet_lite-*-py3-none-any.whl | head -1)"
          TMPDIR="$(mktemp -d)"
          python -m wheel unpack -d "$TMPDIR" "$ANY_WHEEL"
          UNPACKED="$(ls -d "$TMPDIR"/statelet_lite-*)"
          sed -i'' -e 's/^Tag: py3-none-any$/Tag: py3-none-${{ matrix.platform_tag }}/' \
              "$UNPACKED"/statelet_lite-*.dist-info/WHEEL
          python -m wheel pack -d dist "$UNPACKED"
          rm -f "$ANY_WHEEL"
          rm -rf "$TMPDIR"

          ls -lh dist/

      - name: Smoke-test the wheel
        if: matrix.native == 'yes'
        working-directory: .
        run: |
          set -euo pipefail
          # Windows venvs put the interpreter in Scripts/, not bin/.
          case "$RUNNER_OS" in Windows) VBIN="Scripts" ;; *) VBIN="bin" ;; esac
          python -m venv smoke-venv
          V="smoke-venv/$VBIN"
          "$V/python" -m pip install --upgrade pip
          # --no-deps: this checks the wheel we just built, not PyPI's copy of
          # statelet-sdk, which the dependency would otherwise drag in.
          "$V/python" -m pip install --no-deps wheel-src/dist/*.whl
          "$V/python" -c "import statelet_lite; print(statelet_lite.__file__)"
          # The console script is a thin shim that execs this file; if the
          # retag/copy dance dropped it the wheel is useless, so fail the
          # build rather than ship it.
          "$V/python" - <<'PY'
          import os, sys, statelet_lite
          resolved = statelet_lite.binary_path()
          print("bundled binary:", resolved)
          if not os.path.isfile(resolved):
              sys.exit("statelet-lite is missing from this wheel: %s" % resolved)
          if os.name != "nt" and not os.access(resolved, os.X_OK):
              sys.exit("not executable in wheel: %s" % resolved)

          # The admin UI has to survive packaging too — it is the thing a user
          # sees on the management port, and a wheel without it serves 404s
          # while looking perfectly healthy otherwise.
          ui = statelet_lite.ui_dir()
          if ui is None:
              sys.exit("the admin UI is missing from this wheel")
          assets = os.path.join(ui, "assets")
          n = len(os.listdir(assets)) if os.path.isdir(assets) else 0
          print("admin UI:", ui, "(%d asset files)" % n)
          if n == 0:
              sys.exit("the admin UI has no assets; the Vite build produced nothing")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-lite-${{ matrix.target }}
          path: wheel-src/dist/*.whl
          if-no-files-found: error

  # ── PyPI ─────────────────────────────────────────────────────────────────

  publish-pypi:
    needs: build
    if: ${{ !inputs.dry_run && !inputs.skip_pypi }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC) — no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-lite-*
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          verbose: true

  # ── OS packages ──────────────────────────────────────────────────────────

  package-deb:
    needs: [meta, build]
    if: ${{ !inputs.skip_packages }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            arch: amd64
          - platform: linux-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with: { path: lme, persist-credentials: false }
      # Only for the FSL LICENSE text that ships as the copyright file; the
      # unit and the build script both live in this repository.
      - uses: actions/checkout@v4
        with:
          repository: stateletlab/statelet
          ref: ${{ needs.meta.outputs.ref }}
          token: ${{ secrets.STATELET_REPO_TOKEN }}
          path: statelet
          persist-credentials: false
      # A single-path upload is rooted at the directory itself, so the
      # download IS the stage directory.
      - uses: actions/download-artifact@v4
        with:
          name: stage-lite-${{ matrix.platform }}
          path: dl/stage

      - name: Build .deb
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
          STAGE_DIR: dl/stage
          UNIT_FILE: lme/packaging/systemd/statelet-lite.service
          LICENSE_FILE: statelet/LICENSE
          GLIBC_MIN: "2.17"
          PKG_NAME: statelet-lite
          PKG_LICENSE: FSL-1.1-ALv2
          # Both products bind the same default ports and install the admin UI
          # at /usr/share/statelet/ui.
          PKG_CONFLICTS: statelet
          PKG_SUMMARY: "Single-node Statelet database in one binary — KV, vector search, and temporal causal graphs"
          PKG_DESC_LONG: |-
            Statelet Lite fuses the metadata plane, the data node and the
            gateway into one single-node process. It is the FSL-licensed form
            of the Statelet engine; the statelet package carries the separate
            cluster binaries.
        run: bash lme/.github/scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb-lite-${{ matrix.arch }}
          path: "*.deb"
          if-no-files-found: error

  package-rpm:
    needs: [meta, build]
    if: ${{ !inputs.skip_packages }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux-amd64
            arch: x86_64
          - platform: linux-arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with: { path: lme, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          name: stage-lite-${{ matrix.platform }}
          path: dl/stage

      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build .rpm
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          ARCH: ${{ matrix.arch }}
          STAGE_DIR: dl/stage
          UNIT_FILE: lme/packaging/systemd/statelet-lite.service
          PKG_NAME: statelet-lite
          PKG_LICENSE: FSL-1.1-ALv2
          PKG_CONFLICTS: statelet
          PKG_SUMMARY: "Single-node Statelet database in one binary — KV, vector search, and temporal causal graphs"
          PKG_DESC_LONG: |-
            Statelet Lite fuses the metadata plane, the data node and the
            gateway into one single-node process. It is the FSL-licensed form
            of the Statelet engine; the statelet package carries the separate
            cluster binaries.
        run: bash lme/.github/scripts/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-lite-${{ matrix.arch }}
          path: "*.rpm"
          if-no-files-found: error

  package-msi:
    needs: [meta, build]
    if: ${{ !inputs.skip_packages }}
    runs-on: windows-latest
    outputs:
      product_code: ${{ steps.msi.outputs.product_code }}
    steps:
      # The lite installer source lives in this repository, not the engine.
      - uses: actions/checkout@v4
        with: { path: lme, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with:
          name: stage-lite-windows-amd64
          path: dl/stage

      # Pinned to v5 for the same reason as the EE workflow: v7 refuses to
      # build until the Open Source Maintenance Fee EULA is accepted (WIX7015),
      # while v5 is MIT-licensed and speaks the same v4 schema.
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install -g wix --version 5.*

      - name: Build .msi
        id: msi
        shell: pwsh
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          wix build `
            -d Version=$env:VERSION `
            -d BinDir=dl/stage `
            -o "statelet-lite-$env:VERSION-windows-amd64.msi" `
            lme/packaging/windows/installer-lite.wxs
          Get-ChildItem *.msi

          # winget wants the ProductCode, and WiX mints a fresh one per build,
          # so read it back out of the package rather than pinning a guess.
          $msi = (Resolve-Path "statelet-lite-$env:VERSION-windows-amd64.msi").Path
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember(
            "OpenDatabase", "InvokeMethod", $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db,
            @("SELECT Value FROM Property WHERE Property = 'ProductCode'"))
          $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
          $rec = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
          $code = $rec.GetType().InvokeMember("StringData", "GetProperty", $null, $rec, 1)
          Write-Host "ProductCode: $code"
          "product_code=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/upload-artifact@v4
        with:
          name: msi-lite-amd64
          path: "*.msi"
          if-no-files-found: error

  # ── GitHub Release + package channels ────────────────────────────────────

  release:
    needs: [meta, build, package-deb, package-rpm, package-msi]
    if: ${{ !inputs.dry_run && !inputs.skip_packages }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # cut the release on this repository
    steps:
      # Four patterns rather than one download of everything: `stage-lite-*`
      # and `wheel-lite-*` also exist, and neither belongs on the release page
      # (the wheels' distribution channel is PyPI).
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: lite-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: deb-lite-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rpm-lite-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: msi-lite-*
          merge-multiple: true

      # The bare binaries have no extension to checksum-by-eye, so ship one
      # SHA256SUMS covering every asset. `statelet-lite*` also catches the
      # underscore-named debs.
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum statelet-lite* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-v${{ needs.meta.outputs.version }}
          name: Statelet Lite v${{ needs.meta.outputs.version }}
          generate_release_notes: false
          body: |
            `statelet-lite` — the whole database in one single-node process
            (metadata plane, data node and gateway fused into one binary).

            The bare `statelet-lite-*` files are the binary itself: download,
            `chmod +x`, run. The `.tar.gz`/`.zip` archives additionally carry
            the admin UI, which the management port serves from a `ui/`
            directory next to the executable — the bare binary works but
            answers 404 there. The `.deb`/`.rpm`/`.msi` packages install the
            binary, the UI and a service; they are also what
            `pip install statelet-lite`, apt/yum, Homebrew and winget serve.
          files: |
            dist/statelet-lite*
            dist/SHA256SUMS

  publish-brew:
    needs: [meta, release]
    if: ${{ !inputs.dry_run && !inputs.skip_packages }}
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lite-*
          path: dist
          merge-multiple: true

      # The formula unpacks the tar.gz (binary + ui/) and installs the UI at
      # share/statelet/ui — the exe-relative path statelet-lite probes — which
      # is also why it conflicts with the `statelet` formula.
      - name: Generate formula
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p Formula
          sha() { sha256sum "dist/statelet-lite-${VERSION}-$1.tar.gz" | cut -d' ' -f1; }
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/lite-v${VERSION}"
          cat > Formula/statelet-lite.rb <<FORMULA
          class StateletLite < Formula
            desc "Single-node Statelet database in one binary"
            homepage "https://github.com/stateletlab/statelet"
            version "${VERSION}"
            license "FSL-1.1-ALv2"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE}/statelet-lite-${VERSION}-darwin-arm64.tar.gz"
                sha256 "$(sha darwin-arm64)"
              else
                url "${BASE}/statelet-lite-${VERSION}-darwin-amd64.tar.gz"
                sha256 "$(sha darwin-amd64)"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${BASE}/statelet-lite-${VERSION}-linux-arm64.tar.gz"
                sha256 "$(sha linux-arm64)"
              else
                url "${BASE}/statelet-lite-${VERSION}-linux-amd64.tar.gz"
                sha256 "$(sha linux-amd64)"
              end
            end

            conflicts_with "statelet",
              because: "both install the admin UI at share/statelet/ui and bind the same default ports"

            def install
              bin.install "statelet-lite"
              # statelet-lite resolves the admin UI as ../share/statelet/ui
              # from its own location — deliberately not pkgshare, which would
              # be share/statelet-lite and never probed.
              (share/"statelet/ui").install Dir["ui/*"]
            end

            def post_install
              (var/"statelet-lite").mkpath
              (var/"log/statelet-lite").mkpath
            end

            service do
              run [opt_bin/"statelet-lite", var/"statelet-lite"]
              keep_alive true
              working_dir var/"statelet-lite"
              log_path var/"log/statelet-lite/lite.log"
              error_log_path var/"log/statelet-lite/lite.log"
            end

            test do
              # No --version surface: the only positional argument is the data
              # directory, so probing flags would start a server.
              assert_predicate bin/"statelet-lite", :executable?
            end
          end
          FORMULA
          cat Formula/statelet-lite.rb

      # Plain git rather than a third-party push action — see the EE workflow
      # for the history behind that choice.
      - name: Push formula to the tap
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/stateletlab/homebrew-statelet.git" tap
          mkdir -p tap/Formula
          cp Formula/statelet-lite.rb tap/Formula/statelet-lite.rb
          cd tap
          git config user.name  "statelet-ci"
          git config user.email "ci@statelet.ai"
          git add Formula/statelet-lite.rb
          if git diff --cached --quiet; then
            echo "formula unchanged; nothing to push"
            exit 0
          fi
          git commit -qm "statelet-lite ${{ needs.meta.outputs.version }}"
          git push
          echo "pushed Formula/statelet-lite.rb to stateletlab/homebrew-statelet"

      - name: Tap not configured
        if: env.TAP_TOKEN == ''
        run: |
          echo "::warning::TAP_GITHUB_TOKEN is unset and stateletlab/homebrew-statelet may not exist; formula built but not pushed"

  publish-winget:
    needs: [meta, release, package-msi]
    if: ${{ !inputs.dry_run && !inputs.skip_packages }}
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        if: env.WINGET_TOKEN != ''
        with:
          name: msi-lite-amd64
          path: dist

      # `wingetcreate submit` for the same first-submission reason as the EE
      # workflow: `update` needs the package to exist in winget-pkgs already,
      # and `new` is an interactive wizard.
      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          PRODUCT_CODE: ${{ needs.package-msi.outputs.product_code }}
        run: |
          set -euo pipefail
          test -n "$PRODUCT_CODE" || { echo "::error::no ProductCode from package-msi"; exit 1; }
          MSI="dist/statelet-lite-${VERSION}-windows-amd64.msi"
          test -f "$MSI"
          SHA="$(sha256sum "$MSI" | cut -d' ' -f1 | tr 'a-f' 'A-F')"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/lite-v${VERSION}/statelet-lite-${VERSION}-windows-amd64.msi"
          DIR="manifests/s/stateletlab/StateletLite/${VERSION}"
          mkdir -p "$DIR"

          cat > "$DIR/stateletlab.StateletLite.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.version.1.12.0.schema.json
          PackageIdentifier: stateletlab.StateletLite
          PackageVersion: ${VERSION}
          DefaultLocale: en-US
          ManifestType: version
          ManifestVersion: 1.12.0
          EOF

          cat > "$DIR/stateletlab.StateletLite.installer.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
          PackageIdentifier: stateletlab.StateletLite
          PackageVersion: ${VERSION}
          InstallerLocale: en-US
          InstallModes:
            - interactive
            - silent
            - silentWithProgress
          UpgradeBehavior: install
          Commands:
            - statelet-lite
          Installers:
            - Architecture: x64
              InstallerType: wix
              Scope: machine
              InstallerUrl: ${URL}
              InstallerSha256: ${SHA}
              ProductCode: '${PRODUCT_CODE}'
          ManifestType: installer
          ManifestVersion: 1.12.0
          EOF

          cat > "$DIR/stateletlab.StateletLite.locale.en-US.yaml" <<EOF
          # yaml-language-server: \$schema=https://aka.ms/winget-manifest.defaultLocale.1.12.0.schema.json
          PackageIdentifier: stateletlab.StateletLite
          PackageVersion: ${VERSION}
          PackageLocale: en-US
          Publisher: stateletlab
          PublisherUrl: https://github.com/stateletlab
          PackageName: Statelet Lite
          PackageUrl: https://github.com/stateletlab/statelet
          License: FSL-1.1-ALv2
          LicenseUrl: https://github.com/stateletlab/statelet/blob/main/LICENSE
          ShortDescription: Single-node Statelet database in one binary
          Description: >-
            Statelet Lite fuses the Statelet metadata plane, data node and
            gateway into one single-node process — KV, vector search, and
            temporal causal graphs in one database. The installer carries the
            fused binary and the admin UI.
          Tags:
            - database
            - key-value
            - vector-search
            - graph
            - rust
          ManifestType: defaultLocale
          ManifestVersion: 1.12.0
          EOF

          echo "--- manifests"
          for f in "$DIR"/*.yaml; do echo "== $f"; cat "$f"; done

          # The winget-pkgs fork drifts thousands of commits behind upstream
          # between releases, and wingetcreate refuses to reuse a fork it
          # cannot fast-forward ("The forked repository could not be synced
          # with the upstream commits", 2026-08-30 — both publish runs died
          # here). Fast-forward it via the merge-upstream API first; the fork's
          # master carries no unique commits (submissions ride branches), so
          # this always fast-forwards. Failure is a warning, not fatal: a 404
          # just means wingetcreate will create the fork itself.
          curl -fsSL -X POST \
            -H "Authorization: Bearer $WINGET_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/stateletlab/winget-pkgs/merge-upstream \
            -d '{"branch":"master"}' \
            || echo "::warning::winget-pkgs fork sync failed; submit may refuse"

          curl -fsSL -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          # wingetcreate forks microsoft/winget-pkgs itself; the token needs the
          # classic `public_repo` scope and nothing more.
          ./wingetcreate.exe submit \
            --token "$WINGET_TOKEN" \
            --prtitle "New version: stateletlab.StateletLite version ${VERSION}" \
            --no-open \
            "$DIR"

      - name: winget not configured
        if: env.WINGET_TOKEN == ''
        shell: bash
        run: |
          echo "::warning::WINGET_GITHUB_TOKEN is unset; skipping the winget-pkgs submission. \
          It wants a classic PAT with the public_repo scope — wingetcreate forks winget-pkgs itself, \
          so no fork has to exist beforehand."

  # Same `packages` branch as the EE workflow: the pool and index are shared,
  # and the metadata is rebuilt over the whole pool, so each workflow's push
  # preserves the other's packages. (The two workflows run from different
  # dispatches; if one ever pushes while the other is mid-job, the loser
  # fails on the non-fast-forward and a re-run repairs it.)
  publish-apt-yum-repo:
    needs: [meta, release]
    if: ${{ !inputs.dry_run && !inputs.skip_packages }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the `packages` branch of this repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: packages
          path: repo
          # Full history: the concurrent-publish retry below resets onto the
          # freshly fetched remote tip; a depth-1 clone can't always resolve
          # that ref exchange. The branch holds only package metadata + pool
          # files, so this stays cheap.
          fetch-depth: 0
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-lite-*
          path: new-debs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-lite-*
          path: new-rpms
          merge-multiple: true

      - name: Install repo tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev createrepo-c

      - name: Build apt and yum metadata
        run: |
          set -euo pipefail
          if [ ! -d repo/.git ]; then
            mkdir -p repo && (cd repo && git init -q && git checkout -qb packages)
          fi

          mkdir -p repo/apt/pool repo/apt/dists/stable/main/binary-amd64 \
                   repo/apt/dists/stable/main/binary-arm64
          cp new-debs/*.deb repo/apt/pool/
          (
            cd repo/apt
            # Per-architecture Packages files: one index listing both arches
            # makes apt offer an arm64 .deb to an amd64 machine.
            for arch in amd64 arm64; do
              dpkg-scanpackages --arch "$arch" pool \
                > "dists/stable/main/binary-$arch/Packages"
              gzip -kf "dists/stable/main/binary-$arch/Packages"
            done
            cat > dists/stable/Release <<EOF
          Origin: Statelet
          Label: Statelet
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          EOF
          )

          mkdir -p repo/yum/x86_64 repo/yum/aarch64
          cp new-rpms/*.x86_64.rpm repo/yum/x86_64/
          cp new-rpms/*.aarch64.rpm repo/yum/aarch64/
          createrepo_c repo/yum/x86_64/
          createrepo_c repo/yum/aarch64/

      - name: Publish the packages branch
        run: |
          set -euo pipefail
          cd repo
          git config user.name "statelet-ci"
          git config user.email "ci@statelet.ai"
          url="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add -A
          git commit -qm "packages: statelet-lite ${{ needs.meta.outputs.version }}" || {
            echo "nothing changed"; exit 0; }
          # Concurrent-publish race: the ee and lite workflows both publish
          # this same `packages` branch, so a back-to-back release gets a
          # non-fast-forward rejection here. A rebase would conflict on (and
          # a naive retry would clobber) the GENERATED index files, silently
          # unlisting the other run's packages — so on rejection we reset to
          # the fresh remote tip, re-add our artifacts, RE-SCAN the merged
          # pool, and re-commit. Deterministic, conflict-free, and both runs'
          # packages stay indexed no matter which push lands last.
          for attempt in 1 2 3 4 5; do
            if git push "$url" HEAD:packages; then
              exit 0
            fi
            echo "push rejected (attempt $attempt/5): packages advanced concurrently — re-indexing on the new tip"
            git fetch "$url" packages
            git reset --hard FETCH_HEAD
            mkdir -p apt/pool apt/dists/stable/main/binary-amd64 \
                     apt/dists/stable/main/binary-arm64 yum/x86_64 yum/aarch64
            cp ../new-debs/*.deb apt/pool/
            cp ../new-rpms/*.x86_64.rpm yum/x86_64/
            cp ../new-rpms/*.aarch64.rpm yum/aarch64/
            (
              cd apt
              for arch in amd64 arm64; do
                dpkg-scanpackages --arch "$arch" pool \
                  > "dists/stable/main/binary-$arch/Packages"
                gzip -kf "dists/stable/main/binary-$arch/Packages"
              done
            )
            createrepo_c yum/x86_64/
            createrepo_c yum/aarch64/
            git add -A
            git commit -qm "packages: statelet-lite ${{ needs.meta.outputs.version }}" || {
              echo "already published on the new tip"; exit 0; }
          done
          echo "giving up after 5 attempts"
          exit 1
